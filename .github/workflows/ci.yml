name: Tests and security

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Numerical and application tests (no external market requests)
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: SRC
      - name: Compile source
        run: python -m compileall -q SRC
      - name: Smoke test production WSGI entrypoint
        run: |
          cd SRC
          gunicorn app:server --bind 127.0.0.1:8000 &
          pid=$!
          trap 'kill "$pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/_dash-layout > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Audit pinned runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --no-deps --disable-pip
